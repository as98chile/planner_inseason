<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AS98 — Planner Inseason 2026</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', Arial, sans-serif; background: #eef0f3; font-size: 12px; color: #1a1a1a; }

/* ── Summary Bar ── */
#bar {
  position: sticky; top: 0; z-index: 300;
  background: #0d1b2a; color: #fff;
  padding: 0 18px;
  display: flex; flex-direction: column;
  box-shadow: 0 3px 10px rgba(0,0,0,.4);
}
#bar-top {
  display: flex; align-items: center; gap: 0; flex-wrap: nowrap;
  padding: 7px 0 4px; border-bottom: 1px solid #1e3047;
}
#bar-bot {
  display: flex; align-items: center; gap: 0;
  padding: 4px 0 6px;
}
.brand { font-size: 14px; font-weight: 800; color: #ffd700; letter-spacing: 1px; margin-right: 16px; white-space: nowrap; }
.sep   { width: 1px; height: 28px; background: #2e4057; margin: 0 12px; flex-shrink: 0; }
.kpi   { display: flex; flex-direction: column; align-items: center; min-width: 72px; }
.kpi .lbl { font-size: 8.5px; text-transform: uppercase; color: #8899aa; letter-spacing: .4px; white-space: nowrap; }
.kpi .val { font-size: 15px; font-weight: 700; line-height: 1.2; white-space: nowrap; }
.val.green  { color: #4caf50; }
.val.blue   { color: #64b5f6; }
.val.yellow { color: #ffd700; }
.val.orange { color: #ff9800; }
.val.red    { color: #ef5350; }
.val.white  { color: #fff; }
.val.gray   { color: #888; }
.val.teal   { color: #4dd0e1; }

/* tier pills in bar */
.tier-pill {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 10px 2px 8px; border-radius: 12px;
  font-size: 10px; font-weight: 700; margin-right: 5px;
  border: 1px solid transparent;
}
.tp-sd { background: #1a237e; border-color: #5c6bc0; color: #c5cae9; }
.tp-50 { background: #4a0072; border-color: #ce93d8; color: #f3e5f5; }
.tp-40 { background: #880e4f; border-color: #f06292; color: #fce4ec; }
.tp-30 { background: #b71c1c; border-color: #ef5350; color: #ffcdd2; }
.tp-20 { background: #bf360c; border-color: #ff7043; color: #ffe0b2; }
.tp-15 { background: #0d47a1; border-color: #42a5f5; color: #bbdefb; }
.tp-10 { background: #4a148c; border-color: #ab47bc; color: #e1bee7; }

/* ── Filter bar ── */
#fbar {
  position: sticky; top: 82px; z-index: 200;
  background: #fff; border-bottom: 2px solid #dde2e8;
  padding: 7px 18px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
}
#fbar label { font-size: 11px; font-weight: 600; color: #444; white-space: nowrap; }
#fbar select, #fbar input[type="text"] {
  padding: 4px 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 11px; background: #fff;
}
#search { width: 170px; }
.btn { padding: 5px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: 600; white-space: nowrap; }
.btn-dark   { background: #0d1b2a; color: #fff; }
.btn-green  { background: #2e7d32; color: #fff; }
.btn-orange { background: #e65100; color: #fff; }
.btn-teal   { background: #00695c; color: #fff; }

/* ── Table wrapper ── */
#wrap { overflow: auto; height: calc(100vh - 122px); }
table { width: 100%; border-collapse: collapse; min-width: 2200px; }

/* Section headers */
thead tr.sh th {
  background: #37474f; color: #cfd8dc;
  font-size: 9px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .5px; padding: 3px 6px;
  border-right: 1px solid #455a64;
}
thead tr.sh th.wk-hdr { background: #004d40; color: #b2dfdb; }
thead tr.sh th.pl-hdr { background: #1a237e; color: #c5cae9; }
thead tr.sh th.pr-hdr { background: #212121; color: #bbb; }

thead tr.ch th {
  background: #1e2d3d; color: #d8e4f0;
  padding: 5px 5px; text-align: center;
  font-size: 10px; font-weight: 600; white-space: nowrap;
  border-right: 1px solid #2e4057;
  position: sticky; top: 0; z-index: 100;
}
thead tr.ch th.l { text-align: left; }
th.wk-col  { background: #00332a !important; }
th.pl-col  { background: #1a2a6e !important; }
th.pr-col  { background: #1a1a1a !important; }
td.wk-col  { background: rgba(0,77,64,.04); }
td.pl-col  { background: rgba(26,35,126,.04); }

tbody tr { border-bottom: 1px solid #e4e8ed; }
tbody tr:hover td { filter: brightness(.95); }
td { padding: 4px 5px; text-align: center; vertical-align: middle; white-space: nowrap; }
td.l { text-align: left; }
td.name { font-weight: 600; font-size: 11px; overflow: hidden; text-overflow: ellipsis; max-width: 195px; }
td.tipo { color: #666; font-size: 10px; text-transform: capitalize; }

/* ── Sticky first 3 columns ── */
.col-prod, .col-tipo, .col-stk {
  position: sticky; z-index: 10;
}
th.col-prod, th.col-tipo, th.col-stk {
  z-index: 50;
}
.col-prod { left: 0;    min-width: 200px; max-width: 200px; }
.col-tipo { left: 200px; min-width: 80px; max-width: 80px; }
.col-stk  { left: 280px; min-width: 48px; max-width: 48px; box-shadow: 3px 0 6px rgba(0,0,0,.15); }

/* Background per row type so sticky cells don't bleed */
tr.t0   .col-prod, tr.t0   .col-tipo, tr.t0   .col-stk  { background: #fafafa; }
tr.tsd  .col-prod, tr.tsd  .col-tipo, tr.tsd  .col-stk  { background: #f8f8ff; }
tr.t10  .col-prod, tr.t10  .col-tipo, tr.t10  .col-stk  { background: #f6f1ff; }
tr.t15  .col-prod, tr.t15  .col-tipo, tr.t15  .col-stk  { background: #f0f7ff; }
tr.t20  .col-prod, tr.t20  .col-tipo, tr.t20  .col-stk  { background: #fff8f0; }
tr.t30  .col-prod, tr.t30  .col-tipo, tr.t30  .col-stk  { background: #fff1f1; }
tr.t40  .col-prod, tr.t40  .col-tipo, tr.t40  .col-stk  { background: #fce4ec; }
tr.t50  .col-prod, tr.t50  .col-tipo, tr.t50  .col-stk  { background: #f3e5f5; }
tr.ghdr .col-prod, tr.ghdr .col-tipo, tr.ghdr .col-stk  { background: #2c3e50; }
tr.gsubt .col-prod, tr.gsubt .col-tipo, tr.gsubt .col-stk { background: #1b2e1b; }
tfoot tr .col-prod, tfoot tr .col-tipo, tfoot tr .col-stk { background: #0d1b2a; }
tbody tr:hover .col-prod, tbody tr:hover .col-tipo, tbody tr:hover .col-stk { filter: brightness(.95); }

/* Row tints */
tr.t50  { background: #f3e5f5; }
tr.t40  { background: #fce4ec; }
tr.t30  { background: #fff1f1; }
tr.t20  { background: #fff8f0; }
tr.t15  { background: #f0f7ff; }
tr.t10  { background: #f6f1ff; }
tr.tsd  { background: #f8f8ff; }
tr.t0   { background: #fafafa; }

/* Badges */
.badge { display: inline-block; padding: 2px 7px; border-radius: 9px; font-size: 10px; font-weight: 700; }
.b-sd  { background: #c5cae9; color: #283593; }
.b-50  { background: #f3e5f5; color: #4a0072; }
.b-40  { background: #fce4ec; color: #880e4f; }
.b-30  { background: #ffcdd2; color: #b71c1c; }
.b-20  { background: #ffe0b2; color: #bf360c; }
.b-15  { background: #bbdefb; color: #0d47a1; }
.b-10  { background: #e1bee7; color: #4a148c; }
.b-0   { background: #eeeeee; color: #777; }

/* Discount actual badge */
.dcto-badge {
  display: inline-block; padding: 1px 6px; border-radius: 8px;
  font-size: 10px; font-weight: 700;
  background: #fff3e0; color: #e65100;
}
.dcto-none { color: #bbb; font-size: 10px; }

/* Inputs */
select.tsel {
  padding: 3px 4px; border: 1px solid #bbb; border-radius: 4px;
  font-size: 11px; width: 96px; cursor: pointer; background: #fff;
}
input.sti {
  width: 50px; padding: 3px 3px; border: 1px solid #bbb; border-radius: 4px;
  font-size: 11px; text-align: center; background: #fff;
}
input.sti:disabled { background: #f0f0f0; color: #aaa; cursor: not-allowed; }
input.sti:focus    { outline: none; border-color: #1976d2; }

/* Values */
.rev   { color: #1565c0; font-weight: 700; }
.mgn   { color: #2e7d32; font-weight: 700; }
.dash  { color: #ccc; }
.nocost { color: #bbb; font-size: 10px; }
.warn  { color: #e53935; font-weight: 700; }
.low   { color: #e53935; }
.mid   { color: #f57c00; }
.good  { color: #2e7d32; }
.small { font-size: 10px; color: #999; }
.wk-val { color: #00695c; font-weight: 600; }

/* Group header */
tr.ghdr td {
  background: #2c3e50; color: #ecf0f1;
  font-size: 10px; font-weight: 700; padding: 4px 10px;
  letter-spacing: .3px; text-align: left;
}
/* Subtotal por tipo */
tr.gsubt td {
  background: #1b2e1b; color: #a5d6a7;
  font-size: 10px; font-weight: 700; padding: 3px 5px;
  border-top: 1px solid #2e7d32;
}
tr.gsubt td.wk-sub { color: #80cbc4; text-align: center; }
tr.gsubt td.lbl-sub { text-align: left; padding-left: 10px; color: #fff; }

/* Footer */
tfoot td {
  background: #0d1b2a; color: #fff;
  font-weight: 700; padding: 6px 5px;
  border-top: 2px solid #ffd700;
  font-size: 11px; text-align: center;
}
tfoot td.l { text-align: left; }
</style>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
</head>

    <option value="nodcto">Sin descuento</option>
    <option value="condcto">Con descuento</option>
  </select>
  <button class="btn btn-orange" onclick="bulkST()">ST% masivo...</button>
  <button class="btn btn-dark"   onclick="clearAll()">Limpiar todo</button>
  <button class="btn btn-green"  onclick="exportCSV()">Exportar CSV</button>

</div>

</table>

// ── localStorage ──────────────────────────────────────────────────────────────
function saveLS() {
  var snap = {};
  P.forEach(function(p) { snap[p.title] = { tier: p.tier, st: p.st }; });
  var now = new Date();
  var ts = now.toLocaleDateString('es-CL') + ' ' + now.toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  try {
    localStorage.setItem(LS_KEY, JSON.stringify(snap));
    localStorage.setItem(LS_VER_KEY, PLAN_VER);
    localStorage.setItem(LS_TS_KEY, ts);
  } catch(e) {}
  document.getElementById('last-edit-ts').textContent = ts;
}
function loadLS(arr) {
  var storedVer, snap, storedTs;
  try {
    storedVer = localStorage.getItem(LS_VER_KEY);
    snap      = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
    storedTs  = localStorage.getItem(LS_TS_KEY) || '';
  } catch(e) {}
  if (!snap || storedVer !== PLAN_VER) return;
  arr.forEach(function(p) {
    var s = snap[p.title];
    if (!s) return;
    p.tier = s.tier; p.st = s.st;
  });
  if (storedTs) document.getElementById('last-edit-ts').textContent = storedTs;
}

// ── State ─────────────────────────────────────────────────────────────────────
var P = RAW.map(function(p, i) {
  return {
    id: i, title: p.title, tipo: p.tipo, skus: p.skus || '', stock: p.stock,
    precioPubl: p.precioPubl, precioNeto: p.precioNeto,
    costoNeto: p.costoNeto, margenPct: p.margenPct, maxDcto: p.maxDcto,
    precioActual: p.precioActual, dctoActual: p.dctoActual || 0, mgActual: p.mgActual,
    weekSales: p.weekSales || {},
    tier: p.tier || 0, st: p.st || 0
  };
});
loadLS(P);

// Populate tipo filter
var tipos = [];
P.forEach(function(p) { if (tipos.indexOf(p.tipo) < 0) tipos.push(p.tipo); });
tipos.sort();
var tipoEl = document.getElementById('ftipo');
tipos.forEach(function(t) {

  tipoEl.appendChild(o);
});

// ── Helpers ───────────────────────────────────────────────────────────────────
function clp(n) { return n > 0 ? '$' + Math.round(n).toLocaleString('es-CL') : null; }
function mpCls(v) { return v === null ? '' : v >= 45 ? 'good' : v >= 35 ? 'mid' : 'low'; }
function dash(s) { return s || '<span class="dash">—</span>'; }

function tierDcto(t) {
  if (!t || t === 0) return 0;
  if (t === 'sd') return 0;
  return (parseInt(t) || 0) / 100;
}

function calc(p) {
  var uds  = (p.tier && p.st > 0) ? Math.floor(p.stock * p.st / 100) : 0;
  var dcto = tierDcto(p.tier);
  // Revenue based on Precio Actual (current selling price)
  var precioNetoActual = p.precioActual / 1.19;
  var rev  = uds > 0 ? uds * precioNetoActual * (1 - dcto) : 0;
  var mgn  = (rev > 0 && p.costoNeto > 0) ? rev - uds * p.costoNeto : null;
  var mgnP = (mgn !== null && rev > 0) ? mgn / rev * 100 : null;
  return { uds: uds, rev: rev, mgn: mgn, mgnP: mgnP };
}

function rowClass(p) {
  if (!p.tier) return 't0';
  if (p.tier === 'sd') return 'tsd';
  var n = parseInt(p.tier) || 0;
  if (n === 50) return 't50';
  if (n === 40) return 't40';
  if (n === 30) return 't30';
  if (n === 20) return 't20';
  if (n === 15) return 't15';
  if (n === 10) return 't10';
  return 't0';
}

function tierBadge(t) {
  if (!t || t === 0) return '<span class="badge b-0">—</span>';
  if (t === 'sd') return '<span class="badge b-sd">Sin Dcto</span>';
  var n = parseInt(t);
  var cls = 'b-' + n;
  return '<span class="badge ' + cls + '">' + n + '%</span>';
}

// ── Render ────────────────────────────────────────────────────────────────────
var visibleIds = P.map(function(p) { return p.id; });

function buildSubtotalRow(tipo, tipoWkTotals, tipoCnt) {
  var wkCells = WKS.map(function(w) {
    var t = tipoWkTotals[w.label] || 0;
    return '<td class="wk-sub">' + (t > 0 ? t : '—') + '</td>';
  }).join('');
  return '<tr class="gsubt">'
    + '<td class="lbl-sub col-prod">Σ ' + tipo.toUpperCase() + ' (' + tipoCnt + ' prod.)</td>'
    + '<td class="col-tipo"></td>'
    + '<td class="col-stk"></td>'
    + '<td colspan="7"></td>'
    + wkCells
    + '<td colspan="5"></td>'
    + '</tr>';
}

function renderTable() {
  var vis = P.filter(function(p) { return visibleIds.indexOf(p.id) >= 0; });
  var html = '', lastTipo = null;
  var tipoWkTotals = {}, tipoCnt = 0;

  function flushSubtotal() {
    if (lastTipo !== null) {
      html += buildSubtotalRow(lastTipo, tipoWkTotals, tipoCnt);
    }
    tipoWkTotals = {};
    WKS.forEach(function(w) { tipoWkTotals[w.label] = 0; });
    tipoCnt = 0;
  }

  vis.forEach(function(p) {
    if (p.tipo !== lastTipo) {
      flushSubtotal();
      var cnt = vis.filter(function(x) { return x.tipo === p.tipo; }).length;
      html += '<tr class="ghdr"><td colspan="' + totalCols + '">&#9670; ' + p.tipo.toUpperCase() + ' &mdash; ' + cnt + ' productos</td></tr>';
      lastTipo = p.tipo;
    }
    // Accumulate weekly totals for this type
    WKS.forEach(function(w) {
      tipoWkTotals[w.label] = (tipoWkTotals[w.label] || 0) + ((p.weekSales && p.weekSales[w.label]) || 0);
    });
    tipoCnt++;

    var c  = calc(p);
    var rc = rowClass(p);

    // Precio público
    var mgStr = p.margenPct !== null
      ? '<span class="' + mpCls(p.margenPct) + '">' + p.margenPct.toFixed(1) + '%</span>'
      : '<span class="nocost">S/C</span>';

    // Precio actual y descuento activo
    var dctoStr = p.dctoActual > 0
      ? '<span class="dcto-badge">-' + p.dctoActual.toFixed(1) + '%</span>'
      : '<span class="dcto-none">—</span>';
    var mgActStr = p.mgActual !== null
      ? '<span class="' + mpCls(p.mgActual) + '">' + p.mgActual.toFixed(1) + '%</span>'
      : '<span class="nocost">S/C</span>';

    // Weekly sales cells
    var wkCells = WKS.map(function(w) {
      var qty = (p.weekSales && p.weekSales[w.label]) || 0;
      return '<td class="wk-col">' + (qty > 0 ? '<span class="wk-val">' + qty + '</span>' : '<span class="dash">—</span>') + '</td>';
    }).join('');

    // Tier select options
    var tOpts = [
      ['', '  —  '], ['sd', 'Sin Dcto'], ['10', '10%'],
      ['15', '15%'], ['20', '20%'], ['30', '30%'], ['40', '40%'], ['50', '50%']
    ].map(function(o) {
      var sel = (String(p.tier) === o[0] || (p.tier === 0 && o[0] === '')) ? ' selected' : '';
      return '<option value="' + o[0] + '"' + sel + '>' + o[1] + '</option>';
    }).join('');

    // Projected
    var revStr = c.rev > 0 ? '<span class="rev">' + clp(c.rev) + '</span>' : '<span class="dash">—</span>';
    var mgnStr = (c.mgnP !== null && c.rev > 0)
      ? '<span class="' + mpCls(c.mgnP) + '">' + c.mgnP.toFixed(1) + '%</span>'
      : '<span class="dash">—</span>';

    html += '<tr class="' + rc + '" data-id="' + p.id + '">'
      + '<td class="l name col-prod">' + p.title + '</td>'
      + '<td class="l tipo col-tipo">' + p.tipo + '</td>'
      + '<td class="col-stk"><b>' + p.stock + '</b></td>'
      + '<td>' + dash(clp(p.precioPubl)) + '</td>'
      + '<td>' + dash(clp(p.precioNeto)) + '</td>'
      + '<td>' + (p.costoNeto > 0 ? clp(p.costoNeto) : '<span class="nocost">S/C</span>') + '</td>'
      + '<td>' + mgStr + '</td>'
      + '<td><b>' + dash(clp(p.precioActual)) + '</b></td>'
      + '<td>' + dctoStr + '</td>'
      + '<td>' + mgActStr + '</td>'
      + wkCells
      // Plan
      + '<td class="pl-col"><select class="tsel" onchange="setTier(' + p.id + ',this.value)">' + tOpts + '</select></td>'
      + '<td class="pl-col"><input class="sti" type="number" min="0" max="100" value="' + p.st + '" onchange="setST(' + p.id + ',+this.value)"></td>'
      + '<td class="pl-col">' + (c.uds > 0 ? c.uds : '<span class="dash">—</span>') + '</td>'
      // Proj
      + '<td class="pr-col">' + revStr + '</td>'
      + '<td class="pr-col">' + mgnStr + '</td>'
      + '</tr>';
  });
  // Flush last tipo subtotal
  flushSubtotal();

  document.getElementById('tbody').innerHTML = html;
  refreshTotals();
}

// ── Refresh totals ────────────────────────────────────────────────────────────
function refreshTotals() {
  var totR = 0, totM = 0, totU = 0;
  var byTier = { sd:{r:0,u:0}, 50:{r:0,u:0}, 40:{r:0,u:0}, 30:{r:0,u:0}, 20:{r:0,u:0}, 15:{r:0,u:0}, 10:{r:0,u:0} };

  P.forEach(function(p) {
    var c = calc(p);
    totR += c.rev; totU += c.uds;
    if (c.mgn !== null) totM += c.mgn;
    var t = p.tier;
    if (c.rev > 0) {
      if (t === 'sd')  { byTier.sd.r += c.rev; byTier.sd.u += c.uds; }
      else if (t === 50 || t === '50') { byTier[50].r += c.rev; byTier[50].u += c.uds; }
      else if (t === 40) { byTier[40].r += c.rev; byTier[40].u += c.uds; }
      else if (t === 30) { byTier[30].r += c.rev; byTier[30].u += c.uds; }
      else if (t === 20) { byTier[20].r += c.rev; byTier[20].u += c.uds; }
      else if (t === 15) { byTier[15].r += c.rev; byTier[15].u += c.uds; }
      else if (t === 10) { byTier[10].r += c.rev; byTier[10].u += c.uds; }
    }
  });

  var mp = totR > 0 ? totM / totR * 100 : 0;
  document.getElementById('s-rev').textContent = '$' + (totR / 1e6).toFixed(2) + 'M';
  document.getElementById('s-mgn').textContent = '$' + (totM / 1e6).toFixed(2) + 'M';
  document.getElementById('s-mp').textContent  = mp.toFixed(1) + '%';
  document.getElementById('s-u').textContent   = totU.toLocaleString('es-CL');

  function pill(id, r, u) {
    var el = document.getElementById(id);
    if (!el) return;
    var parts = el.textContent.split('—');
    el.textContent = parts[0] + '— $' + (r / 1e6).toFixed(2) + 'M | ' + u + 'u';
  }
  pill('s-sd', byTier.sd.r, byTier.sd.u);
  pill('s-50', byTier[50].r, byTier[50].u);
  pill('s-40', byTier[40].r, byTier[40].u);
  pill('s-30', byTier[30].r, byTier[30].u);
  pill('s-20', byTier[20].r, byTier[20].u);
  pill('s-15', byTier[15].r, byTier[15].u);
  pill('s-10', byTier[10].r, byTier[10].u);

  // Footer visible
  var vis = P.filter(function(p) { return visibleIds.indexOf(p.id) >= 0; });
  var vS = 0, vU = 0, vR = 0, vM = 0;
  // Weekly totals
  var wkTotals = {};
  WKS.forEach(function(w) { wkTotals[w.label] = 0; });
  vis.forEach(function(p) {
    vS += p.stock;
    var c = calc(p);
    vU += c.uds; vR += c.rev;
    if (c.mgn !== null) vM += c.mgn;
    WKS.forEach(function(w) {
      wkTotals[w.label] += (p.weekSales && p.weekSales[w.label]) || 0;
    });
  });
  var vMp = vR > 0 ? vM / vR * 100 : 0;
  var lbl = document.getElementById('f-lbl');
  var stk = document.getElementById('f-stk');
  var upl = document.getElementById('f-upl');
  var rev = document.getElementById('f-rev');
  var fmp = document.getElementById('f-mp');
  if (lbl) lbl.textContent = 'TOTAL (' + vis.length + ' productos)';
  if (stk) stk.textContent = vS.toLocaleString('es-CL');
  if (upl) upl.textContent = vU > 0 ? vU : '—';
  if (rev) rev.textContent = vR > 0 ? '$' + Math.round(vR).toLocaleString('es-CL') : '—';
  if (fmp) fmp.textContent = vMp > 0 ? vMp.toFixed(1) + '%' : '—';
  // Update weekly footer cells
  WKS.forEach(function(w) {
    var el = document.getElementById('f-wk-' + w.label);
    if (el) el.textContent = wkTotals[w.label] > 0 ? wkTotals[w.label] : '—';
  });
}

// ── Update single row ─────────────────────────────────────────────────────────
// Cols: 0-9 product, 10..10+nWk-1 weeks, 10+nWk: tier, 10+nWk+1: st, 10+nWk+2: uds, 10+nWk+3: rev, 10+nWk+4: mgp
function updateRow(id) {
  var p  = P[id];
  var c  = calc(p);
  var tr = document.querySelector('tr[data-id="' + id + '"]');
  if (!tr) { refreshTotals(); return; }
  tr.className = rowClass(p);
  var sel = tr.querySelector('select.tsel');
  if (sel) sel.value = String(p.tier || '');
  var tds = tr.querySelectorAll('td');
  var udsIdx = 10 + nWk + 2;
  var revIdx = 10 + nWk + 3;
  var mpIdx  = 10 + nWk + 4;
  tds[udsIdx].innerHTML = c.uds > 0 ? c.uds : '<span class="dash">—</span>';
  tds[revIdx].innerHTML = c.rev > 0 ? '<span class="rev">' + clp(c.rev) + '</span>' : '<span class="dash">—</span>';
  tds[mpIdx].innerHTML  = (c.mgnP !== null && c.rev > 0)
    ? '<span class="' + mpCls(c.mgnP) + '">' + c.mgnP.toFixed(1) + '%</span>'
    : '<span class="dash">—</span>';
  refreshTotals();
}

// ── Event handlers ────────────────────────────────────────────────────────────
function setTier(id, val) {
  var p = P[id];
  p.tier = val === '' ? 0 : (val === 'sd' ? 'sd' : parseInt(val));
  if (p.tier && p.st === 0) {
    var n = typeof p.tier === 'number' ? p.tier : 0;
    if (n >= 40) p.st = 50;
    else if (n === 30) p.st = 40;
    else if (n === 20) p.st = 15;
    else if (n === 15) p.st = 12;
    else p.st = 10;
  } else if (!p.tier) {
    p.st = 0;
  }
  saveLS();
  setTimeout(function() { updateRow(id); }, 0);
}
function setST(id, val) {
  P[id].st = Math.min(100, Math.max(0, val || 0));
  saveLS();
  setTimeout(function() { updateRow(id); }, 0);
}

// ── Filters ───────────────────────────────────────────────────────────────────
function applyFilters() {
  var s   = document.getElementById('search').value.toLowerCase();
  var ft  = document.getElementById('ftipo').value;
  var fi  = document.getElementById('ftier').value;
  var fs  = parseInt(document.getElementById('fstock').value) || 0;
  var fd  = document.getElementById('fdcto').value;
  visibleIds = P.filter(function(p) {
    var matchTier = !fi
      || (fi === '0'  && !p.tier)
      || (fi === 'sd' && p.tier === 'sd')
      || (fi === '10' && p.tier === 10)
      || (fi === '15' && p.tier === 15)
      || (fi === '20' && p.tier === 20)
      || (fi === '30' && p.tier === 30)
      || (fi === '40' && p.tier === 40)
      || (fi === '50' && p.tier === 50);
    var matchDcto = !fd
      || (fd === 'nodcto'  && p.dctoActual === 0)
      || (fd === 'condcto' && p.dctoActual > 0);
    return (!s  || p.title.toLowerCase().indexOf(s) >= 0)
        && (!ft || p.tipo === ft)
        && matchTier && matchDcto
        && (p.stock >= fs);
  }).map(function(p) { return p.id; });
  renderTable();
}

// ── Bulk actions ──────────────────────────────────────────────────────────────
function bulkST() {
  var tier = prompt('Tier a modificar (sd, 10, 15, 20, 30, 40, 50):');
  if (!tier) return;
  var st = prompt('Sell-through % para tier "' + tier + '":');
  if (st === null) return;
  var stVal = Math.min(100, Math.max(0, parseFloat(st) || 0));
  P.forEach(function(p) {
    if (tier === 'sd' && p.tier === 'sd') p.st = stVal;
    else if (parseInt(tier) === p.tier) p.st = stVal;
  });
  saveLS(); renderTable();
}
function clearAll() {
  if (!confirm('Limpiar TODOS los tiers y sell-throughs?')) return;
  P.forEach(function(p) { p.tier = 0; p.st = 0; });
  try { localStorage.removeItem(LS_KEY); } catch(e) {}
  renderTable();
}

// ── Export CSV ────────────────────────────────────────────────────────────────
function exportCSV() {
  var wkHeaders = WKS.map(function(w) { return w.label; }).join(',');
  var lines = ['"Producto","Tipo",Stock,PrecioPubl,PrecioNeto,CostoNeto,Margen%,PrecioActual,DctoActual%,MgActual%,' + wkHeaders + ',Tier,ST%,UdsSemana,RevSemana,MgSemana%'];
  P.forEach(function(p) {
    var c = calc(p);
    var wkVals = WKS.map(function(w) { return (p.weekSales && p.weekSales[w.label]) || 0; }).join(',');
    lines.push([
      '"' + p.title + '"', '"' + p.tipo + '"', p.stock,
      p.precioPubl, p.precioNeto, p.costoNeto,
      p.margenPct !== null ? p.margenPct : '',
      p.precioActual, p.dctoActual, p.mgActual !== null ? p.mgActual : '',
      wkVals,
      p.tier || '', p.st, c.uds,
      c.rev > 0 ? Math.round(c.rev) : '',
      c.mgnP !== null ? c.mgnP.toFixed(1) : ''
    ].join(','));
  });
  var blob = new Blob(['﻿' + lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'inseason_plan.csv'; a.click();
}

// ── Export XLSX ───────────────────────────────────────────────────────────────
function exportXLSX() {
  var rows = P.filter(function(p) { return p.tier && (p.tier === 'sd' || typeof p.tier === 'number'); });
  if (!rows.length) { alert('No hay productos con Tier asignado.'); return; }
  var header = ['Producto', 'SKU', 'Tipo', 'Precio Público', 'Precio Actual', 'Descuento Actual %', 'Descuento Tier %', 'Precio con Tier'];
  var wsData = [['Descuentos Inseason 2026 — Semana S' + WEEK_DATA.currentWeek], [], header];
  rows.forEach(function(p) {
    var dctoTier = (p.tier === 'sd' || !p.tier) ? 0 : (parseInt(p.tier) || 0);
    var precioTier = Math.floor(p.precioActual * (1 - dctoTier / 100) / 10) * 10;
    wsData.push([
      p.title, p.skus || '', p.tipo,
      p.precioPubl, p.precioActual,
      p.dctoActual / 100, dctoTier / 100, precioTier
    ]);
  });

  var ws = XLSX.utils.aoa_to_sheet(wsData);
  // Format header row
  ws['!cols'] = [
    {wch:35},{wch:20},{wch:12},{wch:14},{wch:14},{wch:16},{wch:16},{wch:16}
  ];
  // Number formats
  var numFmt = { numFmtId: 164, formatCode: '$#,##0' };
  var pctFmt = { numFmtId: 165, formatCode: '0.0%' };
  rows.forEach(function(_, i) {
    var r = i + 4; // row 1 title, 2 blank, 3 header, 4+
    ['D','E'].forEach(function(col) {
      var cell = ws[col + r];
      if (cell) { cell.t = 'n'; cell.z = '$#,##0'; }
    });
    ['F','G'].forEach(function(col) {
      var cell = ws[col + r];
      if (cell) { cell.t = 'n'; cell.z = '0.0%'; }
    });
  });

  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Inseason S' + WEEK_DATA.currentWeek);
  XLSX.writeFile(wb, 'Descuentos_Inseason2026.xlsx');
}

renderTable();
</script>
